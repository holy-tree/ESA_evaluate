<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ESA · 评测排行榜</title><link rel="stylesheet" href="{{ url_for('static',filename='style.css') }}"><link rel="stylesheet" href="{{ url_for('static',filename='leaderboard.css') }}"></head>
<body><header><div class="container brand"><a href="/" class="brand-mark">ESA</a><div><strong>评测排行榜</strong><small>PERSISTENT LEADERBOARD · CHANNEL MACRO F0.5</small></div><a class="brand-link" href="/">返回评测</a></div></header><main class="container leaderboard-page"><section class="panel"><h1>评测排行榜</h1><p class="muted">按协议分别排名；每个用户 ID 展示最佳总分对应的提交时间。</p>{% if error %}<p class="alert error" role="alert">{{ error }}</p>{% endif %}{% if catalogue %}<form method="get" class="board-selector"><label for="board-scope">选择持久化榜单</label><select id="board-scope" name="scope">{% for item in catalogue %}<option value="{{ item.key }}" {{ 'selected' if board and item.key == board.key }}>{{ item.config.mission_id }} · {{ item.config.version }} · {{ '真实 ESA' if item.config.source == 'real' else '演示' }} · {{ item.config.selected_categories|join('+') }} · {{ item.config.start }} → {{ item.config.end }} · {{ item.config.target_channels|length }} 通道 · 标签 {{ item.config.data_fingerprint[:8] }}</option>{% endfor %}</select><button class="secondary">查看榜单</button></form>{% endif %}{% if board %}{% include '_leaderboard_table.html' %}{% elif not error %}<p>尚无已保存的提交。完成一次评测后会自动生成榜单。</p>{% endif %}</section></main></body></html>
